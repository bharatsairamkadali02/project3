name: Deploy Portfolio to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-cicd-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Provision and Deploy Portfolio
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ap-south-1
      PROJECT_NAME: portfolio-cicd

    steps:
      # 1. Checkout the repository on the GitHub Actions runner.
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Validate the website before provisioning or deployment.
      - name: Validate website files
        shell: bash
        run: |
          set -euo pipefail

          REQUIRED_FILES=(
            "index.html"
            "style.css"
            "script.js"
            "profile.png"
            "project1.jpg"
            "project2.jpg"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [ ! -s "$FILE" ]; then
              echo "ERROR: $FILE is missing or empty in the repository root."
              echo "Restore the website files and commit them to main."
              exit 1
            fi
          done

          echo "All required website files are present."

      # 3. Install Terraform.
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      # 4. Configure AWS using your existing repository secrets.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESSKEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 5. Confirm the AWS account identity.
      - name: Verify AWS credentials
        run: aws sts get-caller-identity

      # 6. Find the existing project EC2 or provision one.
      - name: Find or create EC2
        id: ec2
        shell: bash
        run: |
          set -euo pipefail

          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Project,Values=${PROJECT_NAME}" \
              "Name=instance-state-name,Values=pending,running,stopping,stopped" \
            --query 'Reservations[].Instances[].InstanceId | [0]' \
            --output text)

          if [ "${INSTANCE_ID}" = "None" ] || [ -z "${INSTANCE_ID}" ]; then
            echo "No existing project EC2 was found."
            echo "Creating AWS infrastructure with Terraform."

            cd terraform

            terraform init -backend=false
            terraform fmt -recursive
            terraform validate

            terraform plan \
              -var-file=variables.tfvars \
              -out=tfplan

            terraform apply \
              -auto-approve \
              tfplan

            cd ..

            INSTANCE_ID=$(aws ec2 describe-instances \
              --filters \
                "Name=tag:Project,Values=${PROJECT_NAME}" \
                "Name=instance-state-name,Values=pending,running" \
              --query 'Reservations[].Instances[].InstanceId | [0]' \
              --output text)
          fi

          if [ "${INSTANCE_ID}" = "None" ] || [ -z "${INSTANCE_ID}" ]; then
            echo "ERROR: Could not find or create EC2."
            exit 1
          fi

          STATE=$(aws ec2 describe-instances \
            --instance-ids "${INSTANCE_ID}" \
            --query 'Reservations[0].Instances[0].State.Name' \
            --output text)

          if [ "${STATE}" = "stopped" ]; then
            aws ec2 start-instances \
              --instance-ids "${INSTANCE_ID}"
          elif [ "${STATE}" = "stopping" ]; then
            aws ec2 wait instance-stopped \
              --instance-ids "${INSTANCE_ID}"

            aws ec2 start-instances \
              --instance-ids "${INSTANCE_ID}"
          fi

          aws ec2 wait instance-running \
            --instance-ids "${INSTANCE_ID}"

          echo "instance_id=${INSTANCE_ID}" >> "$GITHUB_OUTPUT"
          echo "Using EC2 instance: ${INSTANCE_ID}"

      # 7. Wait for EC2 to become available in Systems Manager.
      - name: Wait for SSM connection
        env:
          INSTANCE_ID: ${{ steps.ec2.outputs.instance_id }}
        shell: bash
        run: |
          set -euo pipefail

          ONLINE=false

          for ATTEMPT in $(seq 1 45); do
            STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=${INSTANCE_ID}" \
              --query 'InstanceInformationList[0].PingStatus' \
              --output text 2>/dev/null || true)

            if [ "${STATUS}" = "Online" ]; then
              ONLINE=true
              echo "EC2 is online in Systems Manager."
              break
            fi

            echo "Waiting for SSM registration (${ATTEMPT}/45)..."
            sleep 10
          done

          if [ "${ONLINE}" != "true" ]; then
            echo "ERROR: EC2 did not register with SSM."
            echo "Check the SSM agent, IAM role, and outbound network."
            exit 1
          fi

      # 8. Clone/update the repo and deploy on EC2.
      - name: Clone or update repository on EC2
        env:
          INSTANCE_ID: ${{ steps.ec2.outputs.instance_id }}
        shell: bash
        run: |
          set -euo pipefail

          # This script is executed remotely on EC2 using /bin/sh.
          # Do not use Bash-only options such as pipefail here.
          REMOTE_SCRIPT=$(cat <<'REMOTE'
          set -eu

          REPO_URL="https://github.com/bharatsairamkadali02/project3.git"
          BRANCH="main"
          REPO_DIR="/opt/portfolio"
          WEB_ROOT="/var/www/html"

          # Ensure first-boot setup has completed.
          if command -v cloud-init >/dev/null 2>&1; then
            cloud-init status --wait
          fi

          # Install deployment tools only if one is missing.
          if ! command -v git >/dev/null 2>&1 ||
             ! command -v nginx >/dev/null 2>&1 ||
             ! command -v rsync >/dev/null 2>&1 ||
             ! command -v curl >/dev/null 2>&1; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y git nginx rsync curl
          fi

          # Clone the repository if it does not exist yet.
          if [ ! -d "${REPO_DIR}/.git" ]; then
            if [ -d "${REPO_DIR}" ]; then
              rmdir "${REPO_DIR}" 2>/dev/null || true
            fi

            git clone \
              --depth 1 \
              --branch "${BRANCH}" \
              "${REPO_URL}" \
              "${REPO_DIR}"
          fi

          # Fetch and reset to the latest committed main branch.
          git -C "${REPO_DIR}" fetch origin "${BRANCH}"
          git -C "${REPO_DIR}" reset --hard "origin/${BRANCH}"

          # Validate remote files BEFORE rsync --delete.
          # This prevents an empty or incomplete commit from
          # clearing the existing Nginx document root.
          for FILE in \
            index.html \
            style.css \
            script.js \
            profile.png \
            project1.jpg \
            project2.jpg
          do
            if [ ! -s "${REPO_DIR}/${FILE}" ]; then
              echo "ERROR: ${FILE} is missing or empty in ${REPO_DIR}."
              echo "No files were copied to the Nginx web root."
              exit 1
            fi
          done

          # Deploy website files to Nginx.
          # Exclude Git, workflow, and Terraform files.
          rsync -av \
            --delete \
            --delete-excluded \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='terraform/' \
            --exclude='.gitignore' \
            --exclude='README.md' \
            --exclude='*.tfstate*' \
            --exclude='*.tfplan' \
            "${REPO_DIR}/" "${WEB_ROOT}/"

          # Validate the configuration and start Nginx.
          nginx -t
          systemctl enable --now nginx
          systemctl reload nginx

          # Verify that Nginx serves an HTML response.
          curl --fail --silent --show-error \
            http://127.0.0.1/ -o /tmp/portfolio-response.html

          if ! grep -qi '<html' /tmp/portfolio-response.html; then
            echo "ERROR: Nginx did not return expected HTML."
            exit 1
          fi

          echo "Portfolio deployment succeeded."
          REMOTE
          )

          # Safely serialize the multiline script to JSON.
          jq -n --arg command "${REMOTE_SCRIPT}" \
            '{commands: [$command]}' > /tmp/ssm-parameters.json

          # Run deployment commands on the Ubuntu EC2 instance.
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "Clone and deploy portfolio from GitHub" \
            --parameters file:///tmp/ssm-parameters.json \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command ID: ${COMMAND_ID}"

          COMPLETED=false

          for ATTEMPT in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${INSTANCE_ID}" \
              --query 'Status' \
              --output text 2>/dev/null || true)

            if [ "${STATUS}" = "Success" ]; then
              COMPLETED=true
              break
            fi

            case "${STATUS}" in
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "${COMMAND_ID}" \
                  --instance-id "${INSTANCE_ID}" \
                  --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
                  --output json || true
                exit 1
                ;;
            esac

            echo "Deployment status: ${STATUS}"
            sleep 5
          done

          if [ "${COMPLETED}" != "true" ]; then
            echo "ERROR: Timed out waiting for SSM deployment."
            exit 1
          fi

          aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${INSTANCE_ID}" \
            --query 'StandardOutputContent' \
            --output text

      # 9. Verify the public website.
      - name: Verify live portfolio
        env:
          INSTANCE_ID: ${{ steps.ec2.outputs.instance_id }}
        shell: bash
        run: |
          set -euo pipefail

          PUBLIC_IP=$(aws ec2 describe-instances \
            --instance-ids "${INSTANCE_ID}" \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text)

          if [ "${PUBLIC_IP}" = "None" ] || [ -z "${PUBLIC_IP}" ]; then
            echo "ERROR: EC2 has no public IP address."
            exit 1
          fi

          for ATTEMPT in $(seq 1 12); do
            if curl --fail --silent --show-error \
              --max-time 10 "http://${PUBLIC_IP}/" \
              -o /tmp/portfolio-response.html; then

              if grep -qi '<html' /tmp/portfolio-response.html; then
                echo "Portfolio deployment succeeded!"
                echo "Website URL: http://${PUBLIC_IP}"
                exit 0
              fi
            fi

            echo "Waiting for website response (${ATTEMPT}/12)..."
            sleep 5
          done

          echo "ERROR: Website verification failed."
          exit 1