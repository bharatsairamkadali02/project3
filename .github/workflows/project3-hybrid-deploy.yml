name: Project 3 - Deploy Portfolio (EC2 + S3 Hybrid)

on:
  push:
    branches:
      - project3-hybrid-vm-s3
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-project3-hybrid
  cancel-in-progress: false

jobs:
  deploy:
    name: Provision and Deploy Hybrid Portfolio
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ap-south-1
      PROJECT_NAME: portfolio-project3

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Validate website files before deployment
      - name: Validate website files
        shell: bash
        run: |
          set -euo pipefail

          echo "── Validating required portfolio files ──"
          for FILE in \
            index.html \
            style.css \
            script.js \
            profile.png \
            project1.jpg \
            project2.jpg \
            Bharat_Sairam_Resume.pdf
          do
            if [ ! -s "$FILE" ]; then
              echo "ERROR: $FILE is missing or empty."
              exit 1
            fi
            echo "  ✓ $FILE"
          done
          echo "All required portfolio files are present."

      # 3. Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      # 4. Authenticate to AWS
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESSKEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 5. Verify AWS identity
      - name: Verify AWS credentials
        run: aws sts get-caller-identity

      # 6. Resolve S3 Assets Bucket Name
      - name: Resolve assets bucket name
        id: bucket
        shell: bash
        run: |
          set -euo pipefail

          # Priority: GitHub Secret (if set) > variables.tfvars
          SECRET_VAL="${{ secrets.PROJECT3_ASSETS_BUCKET }}"
          if [ -n "$SECRET_VAL" ]; then
            BUCKET="$SECRET_VAL"
            echo "Using bucket name from GitHub Secret: $BUCKET"
            sed -i -E "s/^[[:space:]]*assets_bucket_name[[:space:]]*=.*/assets_bucket_name = \"$BUCKET\"/" terraform-project3/variables.tfvars
          else
            BUCKET=$(sed -nE 's/^[[:space:]]*assets_bucket_name[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' terraform-project3/variables.tfvars | head -n 1)
            echo "Using bucket name from variables.tfvars: $BUCKET"
          fi

          if [ -z "$BUCKET" ]; then
            echo "ERROR: Could not resolve assets_bucket_name."
            exit 1
          fi

          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"
          echo "assets_url=https://${BUCKET}.s3.${AWS_REGION}.amazonaws.com/assets" >> "$GITHUB_OUTPUT"

      # 7. Provision or locate Infrastructure with Terraform
      - name: Provision or locate Infrastructure
        id: infra
        env:
          BUCKET: ${{ steps.bucket.outputs.bucket }}
        shell: bash
        run: |
          set -euo pipefail

          cd terraform-project3

          terraform init -backend=false -input=false

          # If the S3 bucket already exists in AWS account, import it into local terraform state
          if aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "Bucket $BUCKET already exists in AWS. Importing into state..."
            terraform import -input=false -var-file=variables.tfvars aws_s3_bucket.assets "$BUCKET" || true
            terraform import -input=false -var-file=variables.tfvars aws_s3_bucket_public_access_block.assets "$BUCKET" || true
            terraform import -input=false -var-file=variables.tfvars aws_s3_bucket_policy.assets_public_read "$BUCKET" || true
            terraform import -input=false -var-file=variables.tfvars aws_s3_bucket_cors_configuration.assets "$BUCKET" || true
          fi

          terraform fmt -recursive
          terraform validate

          # Check if EC2 instance already exists
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Project,Values=${PROJECT_NAME}" \
              "Name=instance-state-name,Values=pending,running,stopping,stopped" \
            --query 'Reservations[].Instances[].InstanceId | [0]' \
            --output text)

          if [ "$INSTANCE_ID" = "None" ] || [ -z "$INSTANCE_ID" ]; then
            echo "No existing EC2 found. Applying Terraform plan..."
            terraform plan -input=false -var-file=variables.tfvars -out=tfplan
            terraform apply -input=false -auto-approve tfplan

            INSTANCE_ID=$(aws ec2 describe-instances \
              --filters \
                "Name=tag:Project,Values=${PROJECT_NAME}" \
                "Name=instance-state-name,Values=pending,running" \
              --query 'Reservations[].Instances[].InstanceId | [0]' \
              --output text)
          else
            echo "Existing EC2 instance found: $INSTANCE_ID"
            # Ensure S3 bucket & networking are also synchronized
            terraform plan -input=false -var-file=variables.tfvars -out=tfplan
            terraform apply -input=false -auto-approve tfplan || true
          fi

          cd ..

          if [ "$INSTANCE_ID" = "None" ] || [ -z "$INSTANCE_ID" ]; then
            echo "ERROR: Could not find or create EC2."
            exit 1
          fi

          # Ensure instance is running
          STATE=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].State.Name' \
            --output text)

          if [ "$STATE" = "stopped" ]; then
            aws ec2 start-instances --instance-ids "$INSTANCE_ID"
          elif [ "$STATE" = "stopping" ]; then
            aws ec2 wait instance-stopped --instance-ids "$INSTANCE_ID"
            aws ec2 start-instances --instance-ids "$INSTANCE_ID"
          fi

          aws ec2 wait instance-running --instance-ids "$INSTANCE_ID"

          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "Using EC2 instance: $INSTANCE_ID"

      # 8. Wait until EC2 is online in Systems Manager
      - name: Wait for SSM connection
        env:
          INSTANCE_ID: ${{ steps.infra.outputs.instance_id }}
        shell: bash
        run: |
          set -euo pipefail

          ONLINE=false
          for ATTEMPT in $(seq 1 45); do
            STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=${INSTANCE_ID}" \
              --query 'InstanceInformationList[0].PingStatus' \
              --output text 2>/dev/null || true)

            if [ "$STATUS" = "Online" ]; then
              ONLINE=true
              echo "EC2 is online in Systems Manager."
              break
            fi

            echo "Waiting for SSM (${ATTEMPT}/45)..."
            sleep 10
          done

          if [ "$ONLINE" != "true" ]; then
            echo "ERROR: EC2 did not register with SSM."
            echo "Check SSM agent, IAM role and outbound networking."
            exit 1
          fi

      # 9. Upload static assets to S3 bucket
      - name: Upload static assets to S3
        env:
          BUCKET: ${{ steps.bucket.outputs.bucket }}
        shell: bash
        run: |
          set -euo pipefail

          echo "── Uploading static assets to s3://${BUCKET}/assets/ ──"

          for FILE in profile.png project1.jpg project2.jpg Bharat_Sairam_Resume.pdf; do
            aws s3 cp "$FILE" "s3://${BUCKET}/assets/${FILE}"
            echo "  ✓ Uploaded $FILE"
          done

          echo "All static assets uploaded to S3 successfully."

      # 10. Rewrite asset URLs in index.html to point to S3
      - name: Rewrite asset URLs in index.html
        env:
          ASSETS_URL: ${{ steps.bucket.outputs.assets_url }}
        shell: bash
        run: |
          set -euo pipefail

          echo "── Rewriting asset URLs to S3: ${ASSETS_URL} ──"

          sed -i \
            -e "s|src=\"profile\.png\"|src=\"${ASSETS_URL}/profile.png\"|g" \
            -e "s|src=\"project1\.jpg\"|src=\"${ASSETS_URL}/project1.jpg\"|g" \
            -e "s|src=\"project2\.jpg\"|src=\"${ASSETS_URL}/project2.jpg\"|g" \
            -e "s|href=\"project1\.jpg\"|href=\"${ASSETS_URL}/project1.jpg\"|g" \
            -e "s|href=\"project2\.jpg\"|href=\"${ASSETS_URL}/project2.jpg\"|g" \
            -e "s|href=\"Bharat_Sairam_Resume\.pdf\"|href=\"${ASSETS_URL}/Bharat_Sairam_Resume.pdf\"|g" \
            index.html

          if ! grep -q "${ASSETS_URL}" index.html; then
            echo "ERROR: URL rewrite did not replace any asset URLs."
            exit 1
          fi

          echo "Asset URLs rewritten successfully."

      # 11. Deploy website files to EC2 Nginx via SSM
      - name: Deploy to EC2 Nginx via SSM
        env:
          INSTANCE_ID: ${{ steps.infra.outputs.instance_id }}
        shell: bash
        run: |
          set -euo pipefail

          INDEX_B64=$(base64 -w 0 index.html)
          CSS_B64=$(base64 -w 0 style.css)
          JS_B64=$(base64 -w 0 script.js)

          REMOTE_SCRIPT=$(cat <<REMOTE
          set -eu

          REPO_URL="https://github.com/bharatsairamkadali02/project3.git"
          BRANCH="project3-hybrid-vm-s3"
          REPO_DIR="/opt/portfolio"
          WEB_ROOT="/var/www/html"

          if command -v cloud-init > /dev/null 2>&1; then
            cloud-init status --wait
          fi

          if ! command -v git >/dev/null 2>&1 || ! command -v nginx >/dev/null 2>&1 || ! command -v rsync >/dev/null 2>&1 || ! command -v curl >/dev/null 2>&1; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y git nginx rsync curl
          fi

          if [ -d "\${REPO_DIR}/.git" ]; then
            git -C "\${REPO_DIR}" remote set-url origin "\${REPO_URL}"
          else
            [ -e "\${REPO_DIR}" ] && rm -rf "\${REPO_DIR}"
            git clone --depth 1 --branch "\${BRANCH}" "\${REPO_URL}" "\${REPO_DIR}"
          fi

          git -C "\${REPO_DIR}" fetch origin "\${BRANCH}"
          git -C "\${REPO_DIR}" reset --hard "origin/\${BRANCH}"

          echo "Latest deployed commit:"
          git -C "\${REPO_DIR}" log -1 --oneline

          # Deploy HTML/CSS/JS to Nginx web root (images & PDF excluded — served from S3)
          rsync -av \
            --delete \
            --delete-excluded \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='terraform/' \
            --exclude='terraform-project2/' \
            --exclude='terraform-project3/' \
            --exclude='.gitignore' \
            --exclude='README.md' \
            --exclude='*.tfstate*' \
            --exclude='*.tfplan' \
            --exclude='profile.png' \
            --exclude='project1.jpg' \
            --exclude='project2.jpg' \
            --exclude='Bharat_Sairam_Resume.pdf' \
            "\${REPO_DIR}/" "\${WEB_ROOT}/"

          # Write rewritten index.html, style.css, script.js
          echo '${INDEX_B64}' | base64 -d > "\${WEB_ROOT}/index.html"
          echo '${CSS_B64}'   | base64 -d > "\${WEB_ROOT}/style.css"
          echo '${JS_B64}'    | base64 -d > "\${WEB_ROOT}/script.js"

          chmod 644 "\${WEB_ROOT}"/*
          chmod 755 "\${WEB_ROOT}"

          nginx -t
          systemctl enable --now nginx
          systemctl reload nginx

          curl --fail --silent --show-error http://127.0.0.1/ -o /tmp/resp.html
          if ! grep -qi '<html' /tmp/resp.html; then
            echo "ERROR: Nginx did not return HTML."
            exit 1
          fi

          echo "EC2 deployment succeeded."
          REMOTE
          )

          jq -n --arg command "$REMOTE_SCRIPT" '{commands: [$command]}' > /tmp/ssm-parameters.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "Project 3 hybrid deployment" \
            --parameters file:///tmp/ssm-parameters.json \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          COMPLETED=false
          for ATTEMPT in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${INSTANCE_ID}" \
              --query 'Status' \
              --output text 2>/dev/null || true)

            if [ "$STATUS" = "Success" ]; then
              COMPLETED=true
              break
            fi

            case "$STATUS" in
              Failed|Cancelled|TimedOut)
                echo "── SSM Execution Error ──"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "${INSTANCE_ID}" \
                  --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
                  --output json || true
                exit 1
                ;;
            esac

            echo "Deployment status: $STATUS (${ATTEMPT}/60)..."
            sleep 5
          done

          if [ "$COMPLETED" != "true" ]; then
            echo "ERROR: Timed out waiting for SSM deployment."
            exit 1
          fi

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${INSTANCE_ID}" \
            --query 'StandardOutputContent' \
            --output text

      # 12. Verify website and S3 assets
      - name: Verify Live Website and S3 Assets
        env:
          INSTANCE_ID: ${{ steps.infra.outputs.instance_id }}
          ASSETS_URL: ${{ steps.bucket.outputs.assets_url }}
        shell: bash
        run: |
          set -euo pipefail

          PUBLIC_IP=$(aws ec2 describe-instances \
            --instance-ids "${INSTANCE_ID}" \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text)

          echo "EC2 Public IP: $PUBLIC_IP"

          echo "── Verifying Nginx HTTP response ──"
          for ATTEMPT in $(seq 1 12); do
            if curl --fail --silent --show-error --max-time 10 "http://${PUBLIC_IP}/" -o /tmp/web.html; then
              if grep -qi '<html' /tmp/web.html; then
                echo "Nginx website is responding!"
                break
              fi
            fi
            sleep 5
          done

          echo "── Verifying S3 Asset Availability ──"
          for ASSET in profile.png project1.jpg project2.jpg Bharat_Sairam_Resume.pdf; do
            URL="${ASSETS_URL}/${ASSET}"
            HTTP_CODE=$(curl -o /dev/null -s -w "%{http_code}" "$URL")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "  ✓ $ASSET -> HTTP $HTTP_CODE"
            else
              echo "  ✗ $ASSET -> HTTP $HTTP_CODE"
              echo "    URL: $URL"
              exit 1
            fi
          done

          echo "══════════════════════════════════════════════════════"
          echo "   Project 3 Hybrid Deployment Successful!"
          echo "══════════════════════════════════════════════════════"
          echo "  Website URL   : http://${PUBLIC_IP}"
          echo "  Nginx Host    : EC2 (${INSTANCE_ID})"
          echo "  Assets URL    : ${ASSETS_URL}"
          echo "══════════════════════════════════════════════════════"
